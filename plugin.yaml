name: memory-shield
version: 1.1.2
manifest_version: 2
description: "Guard rails for the built-in memory tool: only the owner can correct facts in the owner's profile and nobody can delete them, the agent's notes cannot be deleted, shared chats are read-only except for trusted people. Block, ask, or just log; every edit is undoable from a snapshot."
author: "churnast"
license: MIT
homepage: "https://github.com/churnast/hermes-memory-shield"
tags: [memory, safety, prompt-injection, guardrails]
requires_hermes: ">=0.21.5"
provides_tools: []
provides_hooks:
  - pre_tool_call
config_schema:
  user_profile:
    type: str
    choices: [owner_edits, append_only, no_delete, read_only, "off"]
    default: owner_edits
    label: "Owner profile (memory target 'user')"
    description: "owner_edits: the agent may add facts anywhere it may write, and replace one only when the owner asks in a direct chat, the CLI or a chat in trusted_chats; nobody may delete one. append_only: add only, everywhere."
  agent_notes:
    type: str
    choices: [no_delete, owner_edits, append_only, read_only, "off"]
    default: no_delete
    label: "Agent notes (memory target 'memory')"
    description: "no_delete: the agent may add and update its notes but not delete them."
  group_chats:
    type: str
    choices: [read_only, append_only, no_delete, "off"]
    default: read_only
    label: "Shared chats"
    description: "Applied on top of the levels above in groups, channels, forum topics, guild threads and webhook runs."
  scheduled_jobs:
    type: str
    choices: ["off", read_only, append_only, no_delete]
    default: "off"
    label: "Scheduled jobs"
    description: "Applied on top of the levels above in cron runs. off: no extra limit."
  mode:
    type: str
    choices: [block, approve, observe]
    default: block
    label: "On a violation"
    description: "block: refuse with an explanation. approve: ask the owner through Hermes' approval gate (no effect when approvals are off). observe: allow, but log it, to try the policy first."
  trusted_users:
    type: list
    default: []
    label: "Trusted people in shared chats"
    description: "Ids as platform:id, for example telegram:123456789 (/memory-shield whoami shows yours). Their own messages in groups may write memory within the levels above. When set, a direct chat with anyone else is judged like a shared chat, and only they may use /memory-shield log and restore. The CLI always counts as the owner."
  trusted_chats:
    type: list
    default: []
    label: "Chats with only you and the agent"
    description: "Chat ids (see /memory-shield whoami in that chat), judged like a direct chat. For owner-only groups where Hermes does not pass the sender, such as Telegram groups it observes. Never list a chat with anyone else in it."
  audit_log:
    type: bool
    default: true
    label: "Log refused and flagged writes"
    description: "Keeps the last 500 events in plugin-data/memory-shield/audit.jsonl; /memory-shield log shows them."
  snapshots:
    type: int
    default: 20
    label: "Snapshots per memory file"
    description: "Copies of MEMORY.md / USER.md taken right before the agent edits or deletes entries; /memory-shield restore brings one back. 0 turns them off."
